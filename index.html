<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemScope</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav>
    <h1>ChemScope</h1>
    <ul>
      <li>홈</li>
      <li>학습</li>
      <li>소개</li>
    </ul>
  </nav>

  <section class="main">
    <h2>화학식을 쉽게 이해해보세요</h2>

    <p>
      화학식이나 화학명을 입력하면<br>
      물질의 특징과 정보를 쉽게 알려드립니다.
    </p>

    <div class="search-box">
      <input type="text" placeholder="H2O, NaCl, C2H5OH">
      <button>검색</button>
    </div>

    <div class="example">
      <span>H2O</span>
      <span>NaCl</span>
      <span>CO2</span>
      <span>C2H5OH</span>
    </div>
  </section>

</body>
</html>
