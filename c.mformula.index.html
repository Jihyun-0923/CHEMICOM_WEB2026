<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chemicom - 화학식 검색 결과</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      background:
        radial-gradient(circle at top right, #ead5ff 0%, transparent 28%),
        radial-gradient(circle at bottom left, #d9efff 0%, transparent 28%),
        #fffaff;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      padding: 35px 45px 50px;
      position: relative;
    }

    /* ================= 왼쪽 위 로고 ================= */
    .top-logo {
      position: absolute;
      top: 28px;
      left: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-title {
      margin: 0;
      line-height: .9;
      letter-spacing: -1px;
    }

    .logo-text {
      display: block;
      font-size: 34px;
      font-weight: 900;
      background: linear-gradient(90deg, #0f8fff 0%, #1d7cff 35%, #6c63ff 68%, #b44cf0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .atom-logo {
      position: relative;
      width: 72px;
      height: 72px;
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 64px;
      height: 24px;
      border: 3px solid;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .orbit1 { border-color: #1695e8; transform: translate(-50%, -50%) rotate(0deg); }
    .orbit2 { border-color: #8c39e8; transform: translate(-50%, -50%) rotate(60deg); }
    .orbit3 { border-color: #1db2ea; transform: translate(-50%, -50%) rotate(-60deg); }

    .electron {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0a8fe8, #9b31e7);
      box-shadow: 0 0 10px rgba(147, 51, 234, .8);
    }

    .electron1 { top: -5px; left: 56%; }
    .electron2 { bottom: -4px; right: 18%; }

    /* ================= 상단 검색 영역 ================= */
    .search-section {
      text-align: center;
      margin-top: 100px;
      margin-bottom: 40px;
    }

    .search-title {
      font-size: 42px;
      font-weight: 900;
      color: #6c63ff;
      margin-bottom: 10px;
    }

    .search-sub {
      font-size: 16px;
      color: #8b8b8b;
      margin-bottom: 25px;
    }

    .search-box-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto 20px;
    }

    .search-input {
      flex: 1;
      height: 55px;
      padding: 0 25px;
      border: 2px solid #e2d5f3;
      border-radius: 30px;
      font-size: 18px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.05);
      outline: none;
    }

    .search-btn {
      width: 100px;
      height: 55px;
      border: none;
      border-radius: 30px;
      background: #6c63ff;
      color: white;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-btn:hover {
      background: #5249df;
    }

    .tags {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .tag {
      padding: 8px 18px;
      background: white;
      border: 1px solid #e2d5f3;
      border-radius: 20px;
      font-size: 14px;
      color: #6c63ff;
      cursor: pointer;
    }

    /* ================= 구분선 및 RESULT 타이틀 ================= */
    .divider {
      width: 1100px;
      max-width: 95%;
      margin: 40px auto;
      border: none;
      border-top: 2px dashed #e2d5f3;
    }

    .result-title {
      text-align: center;
      margin-bottom: 5px;
    }

    .result-text {
      display: block;
      font-size: 45px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #12a8ff 0%, #388fff 25%, #8660ff 58%, #c04dff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .searched-name {
      text-align: center;
      font-size: 88px; 
      font-weight: 900;
      color: #8e37e8;
      margin: 0px 0 50px 0;
      letter-spacing: -2px;
      line-height: 1.1;
      text-shadow: 0 6px 20px rgba(142, 55, 232, 0.15);
    }

    /* ================= 1단 와이드 카드 레이아웃 ================= */
    .content {
      width: 1100px;
      max-width: 95%;
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 255, 255, .74);
      border: 3px dashed #d39cff;
      border-radius: 30px;
      box-shadow: 0 0 24px rgba(147, 51, 234, .08);
      position: relative;
    }

    .formula-card {
      padding: 45px 50px;
      width: 100%;
    }

    /* 미니 위험도 배지 */
    .mini-risk-badge {
      position: absolute;
      top: 42px;
      right: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 20px;
      border: 2px solid #e2d5f3;
    }

    .risk-label {
      font-size: 16px;
      font-weight: 900;
      color: #9839e9;
    }

    .risk-level-box {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      background: #ffd60a;
      padding: 4px 14px;
      border-radius: 10px;
    }

    .formula-head {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-bottom: 45px;
    }

    .spark-title {
      position: relative;
      display: inline-block;
      font-size: 36px;
      font-weight: 900;
      background: linear-gradient(90deg, #8e37e8, #0b90e8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .formula-type {
      font-size: 24px;
      font-weight: 900;
      color: #0b90e8;
    }

    .underline {
      position: absolute;
      left: 0;
      bottom: -8px;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #8e37e8, #0b90e8);
    }

    .info-line {
      margin: 28px 0;
      font-size: 20px;
      font-weight: 900;
      line-height: 1.6;
      color: #8f37e8;
    }

    .info-line span {
      color: #0a90e8;
    }

    .button-wrap {
      width: 1100px;
      max-width: 95%;
      margin: 0 auto;
      display: flex;
      justify-content: flex-end;
    }

    .home-btn {
      margin-top: 35px;
      width: 390px;
      height: 82px;
      border: 4px solid #b44cf0;
      border-radius: 28px;
      background: white;
      color: #0b8fe8;
      font-size: 28px;
      font-weight: 900;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      box-shadow: 10px 10px 0 rgba(180, 76, 240, .22);
      transition: .2s;
    }

    .home-btn:hover {
      transform: translateY(-4px);
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="top-logo">
      <h1 class="logo-title">
        <span class="logo-text">Chemicom</span>
      </h1>
      <div class="atom-logo">
        <div class="orbit orbit1"><div class="electron electron1"></div></div>
        <div class="orbit orbit2"><div class="electron electron2"></div></div>
        <div class="orbit orbit3"></div>
      </div>
    </div>

    <section class="search-section">
      <div class="search-title">화학식을 쉽게 이해해보세요</div>
      <div class="search-sub">화학식을 입력하면 물질의 특징과 정보를 쉽게 알려드립니다.</div>
      <div class="search-box-wrap">
        <input type="text" class="search-input" value="H2SO4" placeholder="화학식을 입력하세요 (예: H2O, H2SO4)">
        <button class="search-btn">검색</button>
      </div>
      <div class="tags">
        <span class="tag">H2O</span>
        <span class="tag">H2SO4</span>
        <span class="tag">HCl</span>
        <span class="tag">C2H5OH</span>
      </div>
    </section>

    <hr class="divider">

    <div class="result-title">
      <span class="result-text">Result</span>
    </div>
    <div class="searched-name">황산 (H₂SO₄)</div>

    <main class="content">
      <div class="card formula-card">
        
        <div class="mini-risk-badge">
          <span class="risk-label">위험도</span>
          <span class="risk-level-box" id="riskLevel">Lv.4</span>
        </div>

        <div class="formula-head">
          <div class="spark-title">
            화학식 정보
            <div class="underline"></div>
          </div>
          <div class="formula-type">강산성 물질</div>
        </div>

        <p class="info-line">설명 : <span>강한 탈수 작용과 산성을 가진 대표적인 화공 약품</span></p>
        <p class="info-line">활용 예시 : <span>비료 제조, 납축전지 전해액, 화학 합성 실험</span></p>
        <p class="info-line">주의 사항 : <span>피부 접촉 시 심각한 화상 유발, 흡입 주의</span></p>
        <p class="info-line">분자량 : <span>98.08 g/mol</span></p>
        <p class="info-line">참고 사항 : <span>물과 혼합 시 대량의 열이 발생하므로 항상 물에 산을 조금씩 가하며 희석해야 합니다.</span></p>
      </div>
    </main>

    <div class="button-wrap">
      <button class="home-btn" onclick="location.href='index.html'">
        ⌂ 홈으로 돌아가기
      </button>
    </div>

  </div>

  <script>
    function applyRiskColor(level) {
      const riskBox = document.getElementById("riskLevel");
      riskBox.textContent = "Lv." + level;
      
      if (level <= 1) {
        riskBox.style.background = "#30d158";
      } else if (level <= 3) {
        riskBox.style.background = "#ffd60a";
      } else {
        riskBox.style.background = "#ff3b30";
      }
    }
    applyRiskColor(4);
  </script>

</body>
</html>
