<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chemicom</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      background: #f0f0fa;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      padding: 35px 45px 60px;
      position: relative;
    }

    .top-header {
      position: absolute;
      top: 28px;
      left: 40px;
      right: 45px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .top-logo {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-title {
      margin: 0;
      line-height: .9;
      letter-spacing: -1px;
    }

    .logo-text {
      display: block;
      font-size: 34px;
      font-weight: 900;
      background: linear-gradient(90deg, #0f8fff 0%, #1d7cff 35%, #6c63ff 68%, #b44cf0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .atom-logo {
      position: relative;
      width: 72px;
      height: 72px;
    }

    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 64px;
      height: 24px;
      border: 3px solid;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .orbit1 {
      border-color: #1695e8;
      transform: translate(-50%, -50%) rotate(0deg);
    }

    .orbit2 {
      border-color: #8c39e8;
      transform: translate(-50%, -50%) rotate(60deg);
    }

    .orbit3 {
      border-color: #1db2ea;
      transform: translate(-50%, -50%) rotate(-60deg);
    }

    .electron {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0a8fe8, #9b31e7);
      box-shadow: 0 0 10px rgba(147, 51, 234, .8);
    }

    .electron1 {
      top: -5px;
      left: 56%;
    }

    .electron2 {
      bottom: -4px;
      right: 18%;
    }

    .top-nav {
      display: flex;
      gap: 30px;
    }

    .nav-link {
      font-size: 16px;
      font-weight: 700;
      color: #333;
      text-decoration: none;
      transition: color .2s;
    }

    .nav-link:hover {
      color: #6c63ff;
    }

    .search-section {
      text-align: center;
      margin-top: 130px;
      margin-bottom: 40px;
    }

    .search-title {
      margin-bottom: 15px;
      font-size: 45px;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #5b8fff 0%, #6e6bff 50%, #8b5cf6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .search-sub {
      margin-bottom: 35px;
      font-size: 16px;
      line-height: 1.5;
      color: #555;
    }

    .search-box-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      max-width: 860px;
      margin: 0 auto 30px;
      background: #fff;
      padding: 6px 8px 6px 35px;
      border-radius: 50px;
      box-shadow: 0 12px 35px rgba(147, 51, 234, .07);
    }

    .search-input {
      flex: 1;
      border: none;
      font-size: 18px;
      color: #333;
      outline: none;
      background: transparent;
      min-width: 0;
    }

    .search-input::placeholder {
      color: #bcaedc;
    }

    .search-btn {
      padding: 0 45px;
      height: 58px;
      border: none;
      border-radius: 40px;
      background: linear-gradient(90deg, #5177ff, #9247ff);
      color: white;
      font-size: 19px;
      font-weight: 900;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(108, 99, 255, .2);
    }

    .tags-label {
      margin-bottom: 16px;
      font-size: 15px;
      font-weight: 700;
      color: #7d5fff;
    }

    .tags {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .tag {
      padding: 10px 26px;
      background: #fff;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Orbitron', sans-serif;
      color: #5c4eff;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(147, 51, 234, .06);
    }

    @media (max-width: 820px) {
      .page {
        padding: 28px 20px 48px;
      }

      .top-header {
        position: static;
      }

      .top-nav {
        gap: 18px;
      }

      .search-section {
        margin-top: 54px;
      }

      .search-title {
        font-size: 34px;
      }

      .search-box-wrap {
        padding-left: 22px;
      }

      .search-btn {
        padding: 0 24px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="top-header">
      <div class="top-logo">
        <h1 class="logo-title"><span class="logo-text">Chemicom</span></h1>
        <div class="atom-logo" aria-hidden="true">
          <div class="orbit orbit1"><div class="electron electron1"></div></div>
          <div class="orbit orbit2"><div class="electron electron2"></div></div>
          <div class="orbit orbit3"></div>
        </div>
      </div>
      <nav class="top-nav">
        <a class="nav-link" href="{% url 'home' %}">홈</a>
        <a class="nav-link" href="#">소개</a>
      </nav>
    </header>

    <section class="search-section">
      <div class="search-title">화학식을 쉽게 이해해보세요</div>
      <div class="search-sub">화학식이나 구조식을 입력하면<br>물질의 특징과 사용 정보를 쉽게 알려드립니다.</div>
      <form class="search-box-wrap" action="{% url 'result' %}" method="get">
        <input
          type="text"
          class="search-input"
          name="query"
          placeholder="H2O, NaCl, C2H5OH 등을 입력하세요"
          autocomplete="off"
          required
        >
        <button class="search-btn" type="submit">검색</button>
      </form>
      <div class="tags-label">예시 검색</div>
      <form class="tags" action="{% url 'result' %}" method="get">
        <button class="tag" type="submit" name="query" value="H2O">H2O</button>
        <button class="tag" type="submit" name="query" value="CO2">CO2</button>
        <button class="tag" type="submit" name="query" value="NaCl">NaCl</button>
        <button class="tag" type="submit" name="query" value="C2H5OH">C2H5OH</button>
      </form>
    </section>
  </div>
</body>
</html>
